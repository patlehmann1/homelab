{{define "title"}}Apps{{end}}
{{define "content"}}
<div class="page">
  <header class="hero">
    <p class="eyebrow">Apps · Docker</p>
    <h1>What's running <em>under the hood.</em></h1>
    <p class="lede">{{.ServicesUp}} of {{len .Services}} containers running. If something acts up, a restart takes a few seconds.</p>
  </header>

  <section class="card flush">
    <ul class="svcs">
      {{range .Services}}{{template "service-row" .}}{{end}}
    </ul>
  </section>
</div>
{{end}}
