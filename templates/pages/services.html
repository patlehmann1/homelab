{{define "title"}}Services{{end}}
{{define "content"}}
<div class="page">
  <header class="head">
    <div>
      <span class="kicker mono">drawer 06 · docker</span>
      <h1>Services</h1>
      <p class="lede">{{.ServicesUp}} of {{len .Services}} containers running. Restarting a container takes a few seconds.</p>
    </div>
  </header>

  <section class="panel">
    <div class="table-wrap">
    <table class="table">
      <thead><tr><th></th><th>Container</th><th>Group</th><th>Port</th><th class="num">CPU</th><th class="num">Memory</th><th>State</th><th></th></tr></thead>
      <tbody>
        {{range .Services}}{{template "service-row" .}}{{end}}
      </tbody>
    </table>
    </div>
  </section>
</div>
{{end}}
